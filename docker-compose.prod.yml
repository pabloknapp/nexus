services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Sem 'target' e sem 'command' -> Isso forçará o Docker a ir até o final do Dockerfile 
    # rodando o Next.js no modo standalone minificado CMD ["node", "server.js"]
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - NODE_ENV=production
    # Sem mapeamento de volumes (o código agora estático é 'assado' direto na imagem final)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nexus-network

  db:
    image: postgres:15-alpine
    ports:
      - '5433:5432' # Apenas para acesso direto seu na máquina, na cloud geralmente nós apagamos essa chave "ports" do BD para máxima segurança.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexususer -d nexusdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  postgres_data:
